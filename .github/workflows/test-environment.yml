name: Test SSH Key

# Prints KEY_NAME (variable or secret) and identifies the SSH_KEY secret for a
# GitHub environment. Can be run manually on any branch (workflow_dispatch) or
# reused from other workflows (workflow_call).
# The SSH_KEY private key is never printed; its derived public key
# and fingerprint are printed so the key can be identified without leaking it.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that holds SSH_KEY and KEY_NAME
        type: string
        required: true

permissions:
  contents: read

jobs:
  test-ssh-key:
    name: Print SSH_KEY and KEY_NAME (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_NAME_SECRETS: ${{ secrets.KEY_NAME }}
      KEY_NAME: ${{ vars.KEY_NAME }}
    steps:
      - name: Check secrets and variables
        shell: bash
        run: |
          echo "Environment: $ENVIRONMENT"

          if [[ -n "$SSH_KEY" ]]; then
            echo "SSH_KEY secret exists and is not empty"
          else
            echo "::warning::SSH_KEY secret is missing or empty"
          fi

          if [[ -n "$KEY_NAME_SECRETS" ]]; then
            echo "KEY_NAME_SECRETS secret exists and is not empty"
          else
            echo "::warning::KEY_NAME_SECRETS secret is missing or empty"
          fi

          if [[ -n "$KEY_NAME" ]]; then
            echo "KEY_NAME variable exists and is not empty"
          else
            echo "::warning::KEY_NAME variable is missing or empty"
          fi
