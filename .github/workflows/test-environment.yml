name: Test SSH Key

# Prints KEY_NAME (variable or secret) and identifies the SSH_KEY secret for a
# GitHub environment. Can be run manually on any branch (workflow_dispatch) or
# reused from other workflows (workflow_call).
# The SSH_KEY private key is never printed; its derived public key
# and fingerprint are printed so the key can be identified without leaking it.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that holds SSH_KEY and KEY_NAME
        type: string
        required: true

permissions:
  contents: read

jobs:
  test-ssh-key:
    name: Print SSH_KEY and KEY_NAME (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TEST_A: ${{ secrets.SSH_KEY }}
      TEST_B: ${{ secrets.KEY_NAME }}
      TEST_C: ${{ vars.KEY_NAME }}
    steps:
      - name: Print KEY_NAME
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Variables"
          if [ -n "$TEST_C" ]; then
            echo "KEY_NAME (variable): $TEST_C"
          else
            echo "::warning::TEST_C is not set as a variable for environment '$ENVIRONMENT'"
          fi

          echo "Secrets"
          if [ -n "$TEST_B" ]; then
            echo "KEY_NAME: $TEST_B"
          else
            echo "::warning::TEST_B is not set as a secret for environment '$ENVIRONMENT'"
          fi

          if [ -n "$TEST_A" ]; then
            echo "SSH_KEY: $TEST_A"
          else
            echo "::warning::TEST_A secret is not set for environment '$ENVIRONMENT'"
          fi
